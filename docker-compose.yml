services:
  app_blue:
    image: ${BLUE_IMAGE}
    container_name: app_blue
    ports:
      - "8081:${PORT}"
    environment:
      - PORT=${PORT}
      - RELEASE_ID=${RELEASE_ID}
      - APP_POOL=blue
    networks:
      - app-network
  app_green:
    image: ${GREEN_IMAGE}
    container_name: app_green
    ports:
      - "8082:${PORT}"
    environment:
      - PORT=${PORT}
      - RELEASE_ID=${RELEASE_ID}
      - APP_POOL=green
    networks:
      - app-network
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8080:80"
    environment:
      - PORT=${PORT}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx-init.sh:/nginx-init.sh
    command: /bin/sh /nginx-init.sh
    networks:
      - app-network
    depends_on:
      - app_blue
      - app_green

networks:
  app-network:
    driver: bridge
